global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # C++ gRPC ingress — prometheus-cpp pull server on :8080
  - job_name: deps-ingress
    static_configs:
      - targets: ['ingress:8080']

  # Python processor workers — prometheus-client HTTP server on :8081
  - job_name: deps-processor
    static_configs:
      - targets: ['processor-1:8081', 'processor-2:8081']
