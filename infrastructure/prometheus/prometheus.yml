global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # Phase 4: C++ Ingress node metrics (port wired during instrumentation)
  - job_name: deps-ingress
    static_configs:
      - targets: ['ingress:8080']

  # Phase 4: Python Processor worker metrics (port wired during instrumentation)
  - job_name: deps-processor
    static_configs:
      - targets: ['processor:8081']
